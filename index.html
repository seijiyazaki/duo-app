<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DUO暗記">
<meta name="theme-color" content="#1d3557">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>DUO暗記</title>
<style>
:root {
  --bg: #1d3557; --card: rgba(255,255,255,.86); --solid: #ffffff; --text: #1b1f24; --sub: #5b6472; --line: rgba(27,31,36,.12);
  --accent: #1d4ed8; --accent-text: #ffffff; --good: #15803d; --bad: #dc2626; --weak: #c2410c; --mark: #fde68a;
  --cta: linear-gradient(135deg, #f59e0b, #ef4444);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --card: rgba(22,26,33,.84); --solid: #1a1d23; --text: #e8eaed; --sub: #a3aab3; --line: rgba(255,255,255,.12);
    --accent: #5b8def; --accent-text: #0f1115; --good: #4ade80; --bad: #f87171; --weak: #fb923c; --mark: #713f12;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { background: var(--bg); }
html, body { margin: 0; color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  min-height: 100vh; min-height: 100dvh;
}
/* 画面ごとの背景（海・山の絵）。iPhone は background-attachment: fixed が効かないので固定の要素に描く */
#bg { position: fixed; inset: 0; z-index: -1; background: var(--bg) center 70% / cover no-repeat; transition: background-image .4s; }
#bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.05) 40%, rgba(0,0,0,.25)); }
body[data-scene="home"] #bg { background-image: url(bg-home.svg); }
body[data-scene="daily"] #bg { background-image: url(bg-daily.svg); }
body[data-scene="schedule"] #bg { background-image: url(bg-schedule.svg); }
body[data-scene="free"] #bg { background-image: url(bg-free.svg); }
body[data-scene="settings"] #bg { background-image: url(bg-settings.svg); }
/* 上のバーは透明にして背景の絵を見せる。下にスクロールしたときだけ、文字が読めるよう上からうっすら暗くする */
header {
  position: sticky; top: 0; z-index: 5; background: transparent; transition: background .25s;
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
}
header.scrolled { background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.25) 70%, rgba(0,0,0,0)); }
header h1 { font-size: 17px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
header button { background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.35); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
header #settingsBtn { display: flex; flex-direction: column; justify-content: center; gap: 4px; width: 40px; height: 36px; padding: 0 10px; }
header #settingsBtn i { display: block; height: 2px; border-radius: 1px; background: currentColor; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px 16px; margin-bottom: 14px; }
main > .note { background: var(--card); border-radius: 12px; padding: 10px 12px; }
/* ホーム */
.hero { color: #fff; text-shadow: 0 1px 12px rgba(0,0,0,.45); padding: 18px 4px 22px; }
.kicker { font-size: 12px; letter-spacing: .14em; font-weight: 700; opacity: .9; }
.hero .big { font-size: 40px; font-weight: 800; margin: 6px 0 2px; letter-spacing: .01em; }
.hero .sub { font-size: 14px; opacity: .92; }
.steps { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-size: 14px; font-weight: 600; }
.steps span { padding: 6px 12px; border-radius: 20px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); text-shadow: none; }
.steps span.now { background: #fff; color: #1b1f24; }
.steps span.done { background: rgba(74,222,128,.35); border-color: rgba(74,222,128,.7); }
.cbar { height: 6px; background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; margin: 10px 0 4px; }
.cbar i { display: block; height: 100%; background: #fff; border-radius: 3px; }
button.cta { width: 100%; margin-top: 16px; padding: 18px; font-size: 18px; font-weight: 800; color: #fff; border: 0;
  background: var(--cta); border-radius: 14px; box-shadow: 0 8px 24px rgba(239,68,68,.35); text-shadow: none; }
button.cta small { display: block; font-size: 12px; font-weight: 600; opacity: .9; margin-top: 2px; }
button.cta.done { background: linear-gradient(135deg, #16a34a, #0d9488); box-shadow: 0 8px 24px rgba(13,148,136,.35); }
.ghost { width: 100%; margin-top: 10px; background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.4); text-shadow: none; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 92px; margin: 10px 0 4px; }
.wk div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 11px; color: var(--sub); }
.wk i { display: block; width: 70%; border-radius: 4px 4px 2px 2px; background: var(--accent); opacity: .85; }
.wk div.today { color: var(--text); font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 4px; }
.stats div { text-align: center; }
.stats b { display: block; font-size: 20px; }
.stats span { font-size: 11px; color: var(--sub); }
.panel h2 { display: flex; justify-content: space-between; align-items: baseline; }
.panel h2 small { font-weight: 400; color: var(--sub); font-size: 12px; }
/* スケジュール表 */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { text-align: center; font-size: 11px; color: var(--sub); padding: 2px 0; }
.cal .d { aspect-ratio: 1 / 1.05; border-radius: 8px; padding: 3px 4px; font-size: 11px; display: flex; flex-direction: column; justify-content: space-between; background: var(--line); }
.cal .d.out { visibility: hidden; }
.cal .d.today { outline: 2px solid var(--accent); }
.cal .d .n { font-weight: 600; }
.cal .d .m { font-size: 10px; text-align: right; font-weight: 700; }
.cal .d.plan { background: transparent; border: 1px dashed var(--line); color: var(--sub); }
.calnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.calnav b { font-size: 15px; }
table.sch { width: 100%; border-collapse: collapse; font-size: 13px; }
.sch th { text-align: left; color: var(--sub); font-weight: 600; font-size: 11px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.sch td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.sch tr.cur td { background: rgba(29,78,216,.10); }
.sch .ok { color: var(--good); font-weight: 700; }
.sch .now { color: var(--accent); font-weight: 700; }
.sch .plan { color: var(--sub); }
.sch td.r, .sch th.r { text-align: right; white-space: nowrap; }
.sch td:last-child { white-space: nowrap; font-size: 12px; }
.panel { -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
main { padding: 16px; max-width: 640px; margin: 0 auto; }
button {
  font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 10px; padding: 10px 14px; cursor: pointer;
}
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.icon { padding: 6px 10px; }
button:disabled { opacity: .4; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.seg button { flex: 1; border: 0; border-radius: 0; padding: 9px 4px; font-size: 14px; }
.seg button.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px; text-align: left; width: 100%;
}
.row .t { font-weight: 600; min-width: 82px; }
.row .s { flex: 1; color: var(--sub); font-size: 13px; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--good); }
.weakc { color: var(--weak); font-size: 13px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid .row { flex-direction: column; align-items: stretch; gap: 4px; padding: 10px; }
.grid .row .t { min-width: 0; font-size: 14px; }
.grid .row .s, .grid .weakc { font-size: 12px; }
.grid .bar { display: block; }
.grid .row[data-s="all"] { grid-column: 1 / -1; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px;
  min-height: 260px; display: flex; flex-direction: column; gap: 14px;
}
.meta { color: var(--sub); font-size: 13px; display: flex; justify-content: space-between; }
.prompt { font-size: 19px; line-height: 1.6; }
.answer { font-size: 18px; line-height: 1.6; border-top: 1px dashed var(--line); padding-top: 14px; }
.answer.hidden { display: none; }
.en { font-family: -apple-system, "Helvetica Neue", sans-serif; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.words { font-size: 14px; color: var(--sub); line-height: 1.8; }
.words b { color: var(--text); }
.tapzone { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 14px; border-radius: 12px; border: 1px dashed var(--line); min-height: 64px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.actions button { padding: 14px; font-weight: 600; }
.actions .weak { color: var(--weak); }
.actions .good { color: var(--good); }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
.nav button { flex: 1; }
.flag { color: var(--weak); font-weight: 600; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.tools button { flex: 1; font-size: 14px; }
.tools button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.empty { text-align: center; color: var(--sub); line-height: 1.8; padding: 32px 16px; background: var(--card); border-radius: 16px; }
textarea { width: 100%; min-height: 180px; font: 14px ui-monospace, Menlo, monospace; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
label.field { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
select, input[type=range] { font: inherit; max-width: 60%; }
h2 { font-size: 15px; margin: 24px 0 8px; }
p.note { color: var(--sub); font-size: 13px; line-height: 1.7; }
code { font-size: 12px; background: var(--line); padding: 1px 4px; border-radius: 4px; }
.typing { display: flex; flex-direction: column; gap: 10px; }
.typing textarea { min-height: 84px; font: 17px -apple-system, "Helvetica Neue", sans-serif; line-height: 1.5; }
.typing .nav { margin-top: 0; }
.typing .nav button { padding: 10px 6px; white-space: nowrap; }
.fill { line-height: 2.2; }
.fill input { font: inherit; border: 0; border-bottom: 2px solid var(--accent); background: transparent; color: var(--text); padding: 0 2px; outline: none; border-radius: 0; }
.fill input.miss { border-bottom-color: var(--weak); }
.fill input.typo { border-bottom-color: #f59e0b; background: rgba(245,158,11,.14); }
.msg { font-size: 14px; color: var(--weak); }
.msg:empty { display: none; }
.msg .close { display: block; font-size: 24px; font-weight: 800; color: #f59e0b; margin-bottom: 4px; animation: pop .35s ease-out; }
.fixes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin: 8px 0 2px; font-size: 17px; }
.fixes .fixhead { width: 100%; text-align: center; font-size: 12px; color: var(--sub); font-family: -apple-system, "Hiragino Sans", sans-serif; }
.fixes del { color: var(--bad); text-decoration: line-through double var(--bad); }
.fixes ins { color: var(--good); text-decoration: none; font-weight: 700; }
.fixes .miss { color: var(--sub); font-size: 13px; }
.nexthint { text-align: center; font-size: 13px; color: var(--sub); margin-top: 4px; }
.card.done { cursor: pointer; }
.playbtn { width: 100%; padding: 16px; font-size: 18px; font-weight: 700; background: var(--weak); border-color: var(--weak); color: var(--accent-text); }
.playbtn.on { background: var(--good); border-color: var(--good); }
.excellent { font-size: 30px; font-weight: 800; color: var(--good); text-align: center; padding: 12px 0; animation: pop .35s ease-out; }
.excellent small { display: block; font-size: 13px; font-weight: 600; color: var(--sub); margin-top: 2px; }
.excellent.lv1, .excellent.lv2 { font-size: 26px; }
.excellent.lv3 { color: var(--accent); }
.excellent.lv4, .excellent.lv5 { font-size: 32px; color: #0ea5e9; }
.excellent.lv6, .excellent.lv7, .excellent.lv8, .excellent.lv9, .excellent.lv10 {
  background: linear-gradient(90deg, #f59e0b, #ef4444, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent; }
.excellent.lv8, .excellent.lv9 { font-size: 36px; }
.excellent.lv10 { font-size: 40px; animation: pop .35s ease-out, glow 1.2s ease-in-out infinite alternate; }
.excellent.miss { color: var(--sub); font-size: 22px; }
.lvbar { display: flex; gap: 3px; justify-content: center; margin-top: 6px; }
.lvbar i { width: 14px; height: 5px; border-radius: 3px; background: var(--line); }
.lvbar i.on { background: linear-gradient(90deg, #f59e0b, #ef4444); }
@keyframes glow { to { filter: drop-shadow(0 0 10px rgba(245,158,11,.8)); } }
#fx { position: fixed; inset: 0; z-index: 15; pointer-events: none; overflow: hidden; perspective: 600px; }
.fx-emoji { position: absolute; font-size: 40px; line-height: 1; transform: translate(-50%,-50%); will-change: transform, opacity; }
.fx-big { font-size: 64px; }
.fx-huge { font-size: 96px; filter: drop-shadow(0 6px 18px rgba(245,158,11,.6)); }
.fx-paper { position: absolute; width: 8px; height: 14px; border-radius: 2px; will-change: transform, opacity; }
.fx-spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; will-change: transform, opacity; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.12); } to { transform: scale(1); opacity: 1; } }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--solid); padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 20; }
</style>
</head>
<body data-scene="home">
<div id="bg"></div>
<header>
  <button class="icon" id="back" hidden aria-label="戻る">‹ 戻る</button>
  <h1 id="title">DUO暗記</h1>
  <button class="icon" id="settingsBtn" aria-label="設定"><i></i><i></i><i></i></button>
</header>
<main id="app"></main>

<script>
'use strict';

// ---------- 保存 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('保存できませんでした'); } }
};
let items = store.get('duo.items', []);
let prog = store.get('duo.progress', { weak: {}, seen: {}, pos: {} });
let settings = Object.assign({ rate: 0.9, autoSpeak: true, chime: true, effects: true, voice: '', listenJa: true, listenRepeat: 1 }, store.get('duo.settings', {}));
let mode = store.get('duo.mode', 'sentence');
const saveProg = () => store.set('duo.progress', prog);
const saveSettings = () => store.set('duo.settings', settings);

// デイリータスクの進み具合と学習記録
// idx: 今のサイクルで取り組む Section の並び順（0 始まり）、phase: cloze（穴埋め）→ sentence（和訳→英文）、pos: その中の問題番号
// log: 日付ごとの学習時間（秒）。s は「サイクル:Section」ごと・phase ごとの秒数
// done: 「サイクル:Section」ごとに穴埋め・和訳→英文を終えた日
const newSched = () => ({ cycle: 1, idx: 0, phase: 'cloze', pos: 0, lastDay: '', log: {}, done: {} });
let sched = Object.assign(newSched(), store.get('duo.schedule', {}));
const saveSched = () => store.set('duo.schedule', sched);
const PHASES = { cloze: '穴埋め', sentence: '和訳→英文' };

const VERSION = '1.25'; // 公開するたびに 0.01 ずつ上げ、CHANGELOG の先頭に足す
const CHANGELOG = [
  { v: '1.25', d: '2026-11-05', items: ['単語カードで、品詞が2つ以上ある意味（lean の〔形〕やせた・〔動〕傾く など）を品詞ごとに改行して出すようにした。lean・fair・present など13語は、新しい取り込み用 CSV（duo_import_midasi_v2.csv）で両方の意味が入る'] },
  { v: '1.24', d: '2026-11-05', items: ['単語カードを入力・採点式にした。日本語の意味を見て見出し語を入力する。look at のように2語以上のものは語の数だけ入力欄を出す（A・B・... などはそのまま表示）', '単語カードも、続けて1回で正解すると10段階で上がる表示・音・演出が出る。1文字のつづり違いは「スペルが少し違うよ！」で直せる', '単語カードの 🔊 は、答えがわかってしまわないよう、答えのあとだけ見出し語を読む'] },
  { v: '1.23', d: '2026-11-04', items: ['パソコンのブラウザでブックマークやタブにアイコンが出るように favicon を付けた'] },
  { v: '1.22', d: '2026-11-04', items: ['4文字以上の語で1文字だけつづりが違うときは、間違いにせず「スペルが少し違うよ！」と出して直せるようにした。直せば1回で正解と同じに扱う（主語の「惜しい！！」と合わせて1問3回まで）'] },
  { v: '1.21', d: '2026-11-04', items: ['正解したあとに、間違えた所を「入力した語（赤の二重線）→ 正しい語（緑）」で表示するようにした'] },
  { v: '1.20', d: '2026-11-04', items: ['正解したあと自動で次へ進まず、カードをタップするか Enter を押すまで答えを表示したままにした', '和訳→英文で主語（we / you など）だけが違うときは「惜しい！！」と出して直せるようにした。直せば1回で正解と同じに扱う（1問につき2回まで）'] },
  { v: '1.19', d: '2026-11-02', items: ['続けて1回で正解するほど表示が10段階で上がるようにした（Good → Nice! → … → Legendary!!）。2回目以降の正解や答えを見たときは OK で、連続は0に戻る', '正解したときに音を鳴らすようにした。レベルが上がると拍手、歓声、口笛が加わり、Lv.10 はスタンディングオベーションになる（設定で切り替え。マナーモードでも鳴る）', '正解の演出を付けた。レベルが上がると、拍手の手、紙吹雪、クラッカー、花火、トロフィーが出てくる（設定で切り替え）'] },
  { v: '1.18', d: '2026-11-02', items: ['右上の「設定」ボタンを三本線のアイコンにした', '上のバーを透明にした（下にスクロールしたときだけ上をうっすら暗くする）'] },
  { v: '1.17', d: '2026-11-02', items: ['設定に「デイリータスクを初期化」を追加（サイクル1の最初に戻し、スケジュール表の記録も消す）'] },
  { v: '1.16', d: '2026-11-02', items: ['ホームをデイリータスク中心にした（1日1 Section、穴埋め→和訳→英文の順。45日で1サイクル）', 'スケジュール表を追加（日ごとの学習時間とSection、カレンダー、完了予定日）。進み具合はここで変えられる', '画面ごとに海や山の背景を付けた', '今までのセクション一覧は「自由学習」に移した'] },
  { v: '1.15', d: '2026-11-02', items: ['通し聞きの2回目は1.25倍、3回目は1.5倍の速さで英文を読むようにした'] },

// CSV/TSV: section, no, english([]で見出し語), japanese, 見出し語の意味(;区切り)
function parseTable(text) {
  const delim = text.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { f += '"'; i++; }
      else if (c === '"') q = false;
      else f += c;
    } else if (c === '"' && f === '') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = '';
    } else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

function toItems(rows) {
  const out = [];
  for (const r of rows) {
    const [sec, no, en, ja, means = ''] = r.map(x => (x || '').trim());
    if (!en || !ja || isNaN(parseInt(sec, 10))) continue; // ヘッダ行などは飛ばす
    let words;
    if (means.includes('=')) { // 見出し語=意味|見出し語=意味 （[ ] とは独立）
      words = means.split('|').filter(Boolean).map(x => {
        const k = x.indexOf('=');
        return { w: x.slice(0, k).trim(), m: x.slice(k + 1).trim() };
      });
    } else { // [ ] の順に ; 区切りの意味を対応させる
      const ms = means ? means.split(/[;；]/).map(s => s.trim()) : [];
      words = [...en.matchAll(/\[([^\]]+)\]/g)].map((m, i) => ({ w: m[1], m: ms[i] || '' }));
    }
    out.push({
      id: `${parseInt(sec, 10)}-${no || out.length + 1}`,
      section: parseInt(sec, 10), no: no || String(out.length + 1), en, ja, words
    });
  }
  return out;
}

const plain = en => en.replace(/\[([^\]]+)\]/g, '$1');
// 見出し語の読み上げ用: "assure A (that) ~" の記号や "fair 1" の番号を除く

// 単語カードの入力用: 見出し語を、入力する語（b: true）と、そのまま見せる ( ) の中・... ・~・A / B・do ... などに分ける
// "fair 1" の番号は除く。例: "remind A of B" → [remind] A [of] B、"be eager to do ..." → [be] [eager] [to] do ...
function wordToks(w) {
  const parts = w.replace(/\s+\d+$/, '').replace(/…/g, '...').split(/(\([^)]*\)|\.\.\.|~|\s+)/).filter(x => x && !/^\s+$/.test(x));
  return parts.map((t, k) => {
    const next = parts[k + 1] || '';
    const fixed = /^\(/.test(t) || t === '...' || t === '~' || /^[A-C]$/.test(t) || /^one(self|'s)$/.test(t) ||
      (/^(do|doing)$/.test(t) && (next === '...' || next === '~'));
    const [, pre, core, post] = t.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
    return { t, pre, core, post, n: fixed ? '' : norm(t), b: !fixed };

}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 入力の採点用: 大文字小文字・記号・アクセントの違いは見ない
const norm = w => w.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[’‘]/g, "'").replace(/[^a-z0-9']/g, '');
// 正解の語 a と入力の語 b の最長共通部分列を取り、合っていた a の位置 → b の位置を返す
function matched(a, b) {
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let x = a.length - 1; x >= 0; x--)
    for (let y = b.length - 1; y >= 0; y--)
      dp[x][y] = a[x] === b[y] ? dp[x + 1][y + 1] + 1 : Math.max(dp[x + 1][y], dp[x][y + 1]);
  const hit = new Map();
  for (let x = 0, y = 0; x < a.length && y < b.length;) {
    if (a[x] === b[y]) { hit.set(x, y); x++; y++; }
    else if (dp[x + 1][y] >= dp[x][y + 1]) x++;
    else y++;
  }
  return hit;
}

// 画面の上に重ねた #fx に絵文字や紙片を出して Web Animations で動かし、終わったら消す（操作のじゃまはしない）

const CONFETTI = ['#f59e0b', '#ef4444', '#8b5cf6', '#22c55e', '#3b82f6', '#ec4899', '#facc15'];

// 紙片を (x, y) から角度 ang（度、0 が真上）のまわりに飛ばし、重力で落とす
function confetti(n, x, y, ang, spread, power) {
  for (let k = 0; k < n; k++) {
    const a = (ang + rnd(-spread, spread)) * Math.PI / 180, v = power * rnd(0.55, 1);
    const vx = Math.sin(a) * v, vy = -Math.cos(a) * v, g = 900, T = rnd(1.4, 2.2);

const player = new Audio();

const idb = r => new Promise((ok, ng) => { r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); });

async function loadAudio() {
  const st = (await audioDB()).transaction('mp3').objectStore('mp3');
  const [keys, blobs] = await Promise.all([idb(st.getAllKeys()), idb(st.getAll())]);
  audioUrls.forEach(u => URL.revokeObjectURL(u));
  audioUrls = new Map(keys.map((k, n) => [k, URL.createObjectURL(new Blob([blobs[n]], { type: 'audio/mpeg' }))]));

  });
}

// zip の中身を [{ name, buf }] で返す（無圧縮と deflate に対応）
// iPhone の Safari は File から切り出した Blob をうまく保存できないことがあるので、ArrayBuffer で扱う
async function unzip(file) {
  const v = new DataView(await file.arrayBuffer());
  let e = v.byteLength - 22;
  while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip ではありません');
  const out = [];
  for (let p = v.getUint32(e + 16, true), n = v.getUint16(e + 10, true); n > 0; n--) {
    const method = v.getUint16(p + 10, true), size = v.getUint32(p + 20, true);
    const nameLen = v.getUint16(p + 28, true), local = v.getUint32(p + 42, true);
    const name = new TextDecoder().decode(new Uint8Array(v.buffer, p + 46, nameLen));
    const start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
    const raw = v.buffer.slice(start, start + size);
    const buf = method === 8 ? await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer() : raw;
    out.push({ name, buf });
    p += 46 + nameLen + v.getUint16(p + 30, true) + v.getUint16(p + 32, true);
  }
  return out;
}

const audioCount = () => { const ja = [...audioUrls.keys()].filter(k => typeof k === 'string').length; return `英文 ${audioUrls.size - ja} 文・和訳 ${ja} 文`; };
async function importAudio(file) {
  toast('音声を読み込んでいます…');
  try {
    const mp3 = (await unzip(file)).map(f => ({ ...f, no: (f.name.match(/(?:^|\/)(\d+)\.mp3$/i) || [])[1], ja: /(?:^|\/)ja\/\d+\.mp3$/i.test(f.name) }))
      .filter(f => f.no && !/(^|\/)(__MACOSX|\._)/.test(f.name));
    if (!mp3.length) { toast('MP3 が見つかりませんでした'); return; }
    const tx = (await audioDB()).transaction('mp3', 'readwrite');
    const st = tx.objectStore('mp3');
    st.clear();
    mp3.forEach(f => st.put(f.buf, f.ja ? `ja:${parseInt(f.no, 10)}` : parseInt(f.no, 10)));
    await new Promise((ok, ng) => { tx.oncomplete = ok; tx.onerror = () => ng(tx.error); });
    await loadAudio();
    toast(`${audioCount()} の音声を取り込みました`); showSettings();
  } catch (err) { toast(`音声を取り込めませんでした（${err.name}: ${err.message}）`, 8000); }
}

// ---------- 日付と学習時間 ----------
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const WD = '日月火水木金土';
const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
const mdw = d => `${md(d)}(${WD[d.getDay()]})`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
// 秒を「1時間05分」「12分」の形にする
const hm = sec => { const m = Math.round(sec / 60); return m >= 60 ? `${Math.floor(m / 60)}時間${String(m % 60).padStart(2, '0')}分` : `${m}分`; };
const hmShort = sec => { const m = Math.round(sec / 60); return m >= 60 ? `${(m / 60).toFixed(1)}h` : `${m}m`; };

// デイリータスクの画面（#card に data-daily がある）を開いている間だけ、1秒ずつ記録する
// 3分間なにも操作せず音も鳴っていないときは数えない
let lastAct = Date.now(), unsaved = 0;
['pointerdown', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, true));
setInterval(() => {
  const card = document.getElementById('card');
  if (!card || !card.dataset.daily || document.visibilityState !== 'visible') return;
  const busy = !player.paused || (synth && synth.speaking);
  if (!busy && Date.now() - lastAct > 180000) return;
  const [key, ph] = card.dataset.daily.split('|');
  const day = sched.log[dayKey()] || (sched.log[dayKey()] = { t: 0, s: {} });
  const s = day.s[key] || (day.s[key] = {});
  day.t++; s[ph] = (s[ph] || 0) + 1;
  if (++unsaved >= 10) { unsaved = 0; saveSched(); }
}, 1000);
const flushTime = () => { if (unsaved) { unsaved = 0; saveSched(); } };
document.addEventListener('visibilitychange', flushTime);
window.addEventListener('pagehide', flushTime);

const curSec = () => sections()[sched.idx];
const secTime = (cycle, sec) => Object.values(sched.log).reduce((a, d) => a + Object.values(d.s[`${cycle}:${sec}`] || {}).reduce((x, y) => x + y, 0), 0);
// 連続して学習した日数（今日まだなら昨日から数える）
function streak() {
  let d = new Date(), n = 0;
  if (!((sched.log[dayKey(d)] || {}).t >= 60)) d = addDays(d, -1);
  while ((sched.log[dayKey(d)] || {}).t >= 60) { n++; d = addDays(d, -1); }
  return n;
}
// 今の Section を始める日。今日の分を終えていれば明日から
const planStart = () => sched.lastDay === dayKey() ? addDays(new Date(), 1) : new Date();

// ---------- デイリータスク ----------
function startDaily() {
  const secs = sections(), sec = curSec(), key = `${sched.cycle}:${sec}`;
  if (!cardsFor(sec, sched.phase).length) { phaseDone(); return; } // 穴埋めのない Section は飛ばす
  startStudy(sec, sched.phase, {
    key, pos: sched.pos,
    onPos: i => { sched.pos = i; saveSched(); },
    onDone: phaseDone
  });
  function phaseDone() {
    flushTime();
    const today = dayKey(), d = sched.done[key] || (sched.done[key] = {});
    d[sched.phase] = today;
    sched.pos = 0;
    if (sched.phase === 'cloze') {
      sched.phase = 'sentence'; saveSched();
      return interlude('穴埋め完了！', `次は Section ${sec} の和訳→英文です。`, '▶ 和訳→英文へ進む', startDaily);
    }
    sched.phase = 'cloze'; sched.lastDay = today; sched.idx++;
    let msg = `今日の学習時間 ${hm((sched.log[today] || {}).t || 0)}`;
    if (sched.idx >= secs.length) { sched.cycle++; sched.idx = 0; msg += `<br>サイクル ${sched.cycle - 1} を終えました。サイクル ${sched.cycle} を始めます。`; }
    saveSched();
    interlude(`Section ${sec} 完了`, msg, '📅 スケジュール表を見る', showSchedule);
  }
}
function interlude(head, msg, label, next) {
  setHeader('今日のタスク', showHome, 'daily');
  app.innerHTML = `<div class="empty">
    <div style="font-size:22px;font-weight:800;color:var(--text)">${head}</div>${msg}<br><br>
    <div class="list"><button class="primary" id="nx">${label}</button><button id="home">ホームに戻る</button></div></div>`;
  document.getElementById('nx').onclick = next;
  document.getElementById('home').onclick = showHome;
}

// ---------- スケジュール表 ----------
let calMonth = null;
function showSchedule() {
  setHeader('スケジュール表', showHome, 'schedule');
  const secs = sections();
  if (!secs.length) { showHome(); return; }
  const cyc = sched.cycle;
  const cycT = secs.reduce((a, s) => a + secTime(cyc, s), 0);
  const allT = Object.values(sched.log).reduce((a, d) => a + d.t, 0);
  const days = Object.values(sched.log).filter(d => d.t >= 60).length;
  const start = planStart();
  const plan = new Map(); // 予定日 → Section
  secs.forEach((s, k) => { if (k >= sched.idx) plan.set(dayKey(addDays(start, k - sched.idx)), s); });
  const finish = addDays(start, secs.length - sched.idx - 1);

  // カレンダー
  const now = new Date();
  if (!calMonth) calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const first = calMonth, lead = first.getDay();
  const nDays = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const heat = t => t ? `background: rgba(29,120,216,${Math.min(0.9, 0.25 + t / 3600 * 0.65)}); color:#fff` : '';
  const cells = [...Array(lead)].map(() => '<div class="d out"></div>').concat([...Array(nDays)].map((_, k) => {
    const d = new Date(first.getFullYear(), first.getMonth(), k + 1), key = dayKey(d), log = sched.log[key];
    const ss = log ? [...new Set(Object.keys(log.s).map(x => x.split(':')[1]))] : [];
    const p = !log && plan.get(key);
    return `<div class="d ${key === dayKey() ? 'today' : ''} ${p ? 'plan' : ''}" style="${heat(log && log.t)}">
      <span class="n">${k + 1}</span><span class="m">${log && log.t ? `S${ss.join(',')}<br>${hmShort(log.t)}` : p ? `S${p}` : ''}</span></div>`;
  }));

  // Section ごとの表
  const rows = secs.map((s, k) => {
    const key = `${cyc}:${s}`, dn = sched.done[key] || {};
    const dates = Object.keys(sched.log).filter(d => sched.log[d].s[key]).sort();
    let st;
    if (dn.sentence) st = '<span class="ok">✓ 完了</span>';
    else if (k === sched.idx) st = `<span class="now">${PHASES[sched.phase]} ${sched.pos + 1}/${cardsFor(s, sched.phase).length}</span>`;
    else if (k < sched.idx) st = '<span class="plan">スキップ</span>';
    else st = `<span class="plan">予定 ${mdw(addDays(start, k - sched.idx))}</span>`;
    return `<tr class="${k === sched.idx ? 'cur' : ''}"><td>${k + 1}</td><td>S${s}</td>
      <td>${dates.map(d => md(fromKey(d))).join(', ') || '—'}</td><td class="r">${secTime(cyc, s) ? hm(secTime(cyc, s)) : '—'}</td><td>${st}</td></tr>`;
  }).join('');

  app.innerHTML = `
    <div class="panel">
      <h2>サイクル ${cyc} <small>Day ${sched.idx + 1} / ${secs.length}</small></h2>
      <div class="cbar" style="background:var(--line)"><i style="width:${sched.idx / secs.length * 100}%;background:var(--accent)"></i></div>
      <div class="stats">
        <div><b>${hmShort(cycT)}</b><span>このサイクル</span></div>
        <div><b>${days}日</b><span>学習した日</span></div>
        <div><b>${mdw(finish)}</b><span>完了予定</span></div>
      </div>
      <p class="note" style="margin:6px 0 0">これまでの合計 ${hm(allT)} · 連続 ${streak()}日</p>
    </div>
    <div class="panel">
      <div class="calnav" style="padding-top:12px"><button class="icon" id="pm">‹</button><b>${first.getFullYear()}年${first.getMonth() + 1}月</b><button class="icon" id="nm">›</button></div>
      <div class="cal">${[...WD].map(w => `<div class="dow">${w}</div>`).join('')}${cells.join('')}</div>
      <p class="note" style="margin:8px 0 0">色が濃いほど長く学習した日です。点線はこれからの予定です。</p>
    </div>
    <div class="panel">
      <h2>Section ごとの記録</h2>
      <table class="sch"><thead><tr><th>Day</th><th>Section</th><th>実施日</th><th class="r">時間</th><th>状態</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="panel">
      <h2>進み具合を変える</h2>
      <p class="note">デイリータスクで次に始める所を選べます。記録した時間は消えません。</p>
      <label class="field">Section <select id="jsec">${secs.map((s, k) => `<option value="${k}" ${k === sched.idx ? 'selected' : ''}>Day ${k + 1} · Section ${s}</option>`).join('')}</select></label>
      <label class="field">内容 <select id="jph">${Object.entries(PHASES).map(([k, v]) => `<option value="${k}" ${k === sched.phase ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <div class="tools" style="margin:12px 0 0"><button class="primary" id="jgo">ここから始める</button><button id="jnew">新しいサイクルを始める</button></div>
    </div>`;
  const $ = id => document.getElementById(id);
  $('pm').onclick = () => { calMonth = new Date(first.getFullYear(), first.getMonth() - 1, 1); showSchedule(); };
  $('nm').onclick = () => { calMonth = new Date(first.getFullYear(), first.getMonth() + 1, 1); showSchedule(); };
  $('jgo').onclick = () => {
    sched.idx = +$('jsec').value; sched.phase = $('jph').value; sched.pos = 0; sched.lastDay = '';
    saveSched(); toast(`Section ${curSec()} の${PHASES[sched.phase]}から始めます`); showSchedule();
  };
  $('jnew').onclick = () => {
    if (!confirm(`サイクル ${cyc + 1} を Section ${secs[0]} から始めます。よろしいですか？`)) return;
    sched.cycle++; sched.idx = 0; sched.phase = 'cloze'; sched.pos = 0; sched.lastDay = '';
    saveSched(); showSchedule();
  };
  const cur = app.querySelector('tr.cur'); // 表は今の Section が見える所から
  if (cur) cur.scrollIntoView({ block: 'nearest' });
  window.scrollTo(0, 0);
}

// ---------- 学習 ----------
// daily を渡すとデイリータスクとして出す（並びは固定、位置は sched に保存、終わったら daily.onDone）
function startStudy(sec, m, daily) {
  const cards = cardsFor(sec, m);
  if (!cards.length) { toast('出題できる問題がありません'); return; }
  if (settings.shuffle && !daily) shuffle(cards);
  const posKey = `${m}:${sec}`;
  combo = 0;
  const keepPos = !daily && sec !== 'weak' && !settings.shuffle; // シャッフル中は毎回最初から
  let i = Math.min(daily ? daily.pos : keepPos ? prog.pos[posKey] || 0 : 0, cards.length - 1);
  let revealed = false;

  function render() {
    const c = cards[i], it = c.it;
    revealed = false;
    const head = daily ? `今日のタスク · ${secName(sec)} · ${MODES[m]}` : `${secName(sec)} · ${MODES[m]}`;
    setHeader(head, daily ? showHome : showFree, daily ? 'daily' : 'free');
    let prompt, answer;
    if (m === 'sentence') {
      prompt = `<div class="prompt">${esc(it.ja)}</div>`;
      answer = `<div class="en">${marked(it.en)}</div>${wordList(it)}`;
    } else if (m === 'cloze') {
      prompt = `<div class="words">${esc(it.ja)}</div>`;
      answer = `<div class="en">${marked(it.en)}</div>${wordList(it)}`;
    } else {
      // 日本語の意味を見て、見出し語を入力する（2語以上なら語の数だけ入力欄を出す）
      prompt = `<div class="prompt" style="font-size:20px;font-weight:600;text-align:center">${c.w.m ? posLines(c.w.m) : '（意味未登録）'}</div>
        ${c.w.m ? '' : `<div class="words">${esc(it.ja)}</div>`}`;
      answer = `<div class="en" style="font-size:28px;font-weight:700;text-align:center">${esc(c.w.w.replace(/\s+\d+$/, ''))}</div>
        <div class="words en">${marked(it.en)}</div><div class="words">${esc(it.ja)}</div>`;
    }
    app.innerHTML = `
      <div class="card" id="card" ${daily ? `data-daily="${daily.key}|${m}"` : ''}>
        <div class="meta"><span>No.${esc(it.no)} · ${i + 1} / ${cards.length}</span>
          <span>${prog.weak[c.key] ? '<span class="flag">● 苦手</span>' : ''}</span></div>
        ${prompt}
        ${m !== 'listen' ? `<div class="typing" id="tap">
          <div class="typing" id="inputs">
            <div class="prompt en fill" id="fill" hidden></div>
            <textarea id="typed" class="en" placeholder="英文を入力" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
            <div class="msg" id="msg"></div>
          </div>
          <div class="nav"><button id="giveup">答えを見る</button><button class="primary" id="submit">Submit</button></div>
        </div>` : '<div class="tapzone" id="tap">タップで答えを表示</div>'}
        <div class="answer hidden" id="ans">${answer}</div>
      </div>
      <div class="actions">
        <button class="weak" id="ng">苦手</button>
        <button class="good" id="ok">覚えた</button>
      </div>
      <div class="nav">
        <button id="prev" ${i === 0 ? 'disabled' : ''}>‹ 前へ</button>
        <button id="say">🔊 英文</button>
        <button id="next">次へ ›</button>
      </div>`;
    if (m !== 'listen') typing(c, m !== 'sentence');
    else document.getElementById('card').onclick = reveal;
    // 単語カードは、答えの前に読み上げると答えがわかってしまうので、答えのあとだけ見出し語を読む
    document.getElementById('say').onclick = () => {
      stopSpeak();
      if (m !== 'word') sayEn(it); else if (revealed) speak(spoken(c.w.w)); else toast('答えのあとで聞けます');
    };
    document.getElementById('prev').onclick = () => go(-1);
    document.getElementById('next').onclick = () => go(1);
    document.getElementById('ok').onclick = () => { delete prog.weak[c.key]; mark(c); go(1); };
    document.getElementById('ng').onclick = () => { prog.weak[c.key] = true; mark(c); go(1); };
  }
  function reveal() {
    if (revealed) return;
    revealed = true;
    document.getElementById('tap').style.display = 'none';
    document.getElementById('ans').classList.remove('hidden');
    if (settings.autoSpeak) { stopSpeak(); sayEn(cards[i].it); }
  }
  // 和訳→英文: 入力を採点し、間違えた語だけを穴埋めにして出し直す
  // 穴埋め（cloze）: [ ] の語を最初から空欄にして採点する
  // 1文字だけのつづりの違い（1文字の入れ違い・抜け・余分・隣どうしの入れ替え）。短い語は別の語になりやすいので4文字以上だけ
  function typo1(a, b) {
    if (a === b || a.length < 4 || Math.abs(a.length - b.length) > 1) return false;
    let i = 0;
    while (i < a.length && a[i] === b[i]) i++;
    if (a.length === b.length) return a.slice(i + 1) === b.slice(i + 1) || (a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2));
    return a.length > b.length ? a.slice(i + 1) === b.slice(i) : a.slice(i) === b.slice(i + 1);
  }
  // 間違いにせず直させる違いを探す。subj: 主語の違い（日本文に主語がないと we / you などがわからない）、typo: 1文字のつづりの違い
  // 主語に合わせて変わる be / have / do と三単現の s の違いは主語の違いに含める。ほかの違いがあれば null
  function nearMiss(want, got) {
    if (want.length !== got.length) return null;
    const P = new Set('i me my mine myself we us our ours ourselves you your yours yourself yourselves they them their theirs themselves he him his himself she her hers herself it its itself'.split(' '));
    const G = { am: 'be', is: 'be', are: 'be', was: 'bep', were: 'bep', "i'm": 'pbe', "we're": 'pbe', "you're": 'pbe', "they're": 'pbe', "he's": 'pbe', "she's": 'pbe', "it's": 'pbe',
      has: 'have', have: 'have', does: 'do', do: 'do', "doesn't": 'dont', "don't": 'dont', "isn't": 'aint', "aren't": 'aint', "wasn't": 'werent', "weren't": 'werent' };
    const subj = [], typo = [];
    for (let k = 0; k < want.length; k++) {
      const a = want[k], b = got[k];
      if (a === b) continue;
      if (P.has(a) && P.has(b)) { subj.push(k); continue; }
      if (G[a] && G[a] === G[b]) continue;
      if (k > 0 && subj.includes(k - 1) && a.replace(/e?s$/, '') === b.replace(/e?s$/, '')) continue; // He respects / We respect
      if (typo1(a, b)) { typo.push(k); continue; }
      return null;
    }
    return subj.length || typo.length ? { subj, typo } : null;
  }
  function typing(c, cloze) {
    const $ = id => document.getElementById(id);
    const tap = $('tap');
    let inBr = false;
    const toks = c.w ? wordToks(c.w.w) : c.it.en.split(/\s+/).filter(Boolean).map(raw => {
      const b = inBr || raw.includes('[');
      inBr = b && !raw.includes(']');
      const t = raw.replace(/[[\]]/g, '');
      const [, pre, core, post] = t.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
      return { t, pre, core, post, n: norm(t), b };
    });
    const ok = toks.map(x => !x.n || (cloze && !x.b)); // 記号だけの語は最初から正解扱い
    const wrong = new Map(), extra = []; // 間違えた所: 語の位置 → 最初に入力した語（'' は抜け）、余分に入れた語
    let tries = 0, peeked = false, close = 0; // peeked: 答えを見たことがある、close: 主語だけ違って直させた回数
    const firstTry = () => {
      const want = [], at = [];
      toks.forEach((x, k) => { ok[k] = !x.n; if (x.n) { want.push(x.n); at.push(k); } });
      const raw = $('typed').value.split(/\s+/).filter(w => norm(w)), got = raw.map(norm);
      const hit = matched(want, got);
      hit.forEach((y, j) => { ok[at[j]] = true; });
      // 合った語どうしの間で、合わなかった正解の語と入力の語を順に組にして、間違えた所として覚える
      const pairs = [...hit.entries(), [want.length, got.length]];
      let px = 0, py = 0;
      for (const [x, y] of pairs) {
        for (let k = 0; px + k < x || py + k < y; k++) {
          const wx = px + k < x ? px + k : -1, gy = py + k < y ? py + k : -1;
          if (wx >= 0) wrong.has(at[wx]) || wrong.set(at[wx], gy >= 0 ? raw[gy] : '');
          else extra.push(raw[gy]);
        }
        px = x + 1; py = y + 1;
      }
      return got.length === want.length;
    };
    const showFill = () => {
      const fill = $('fill');
      fill.innerHTML = toks.map((x, k) => ok[k] ? esc(x.t) : `${esc(x.pre)}<input data-k="${k}" class="${tries > (cloze ? 0 : 1) ? 'miss' : ''}"
        style="width:calc(${x.core.length}ch + 12px)" placeholder="${esc(x.core[0] || '')}"
        autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go">${esc(x.post)}`).join(' ');
      fill.hidden = false; $('typed').hidden = true;
      // スペースで次の空欄へ、空欄が空のときの削除で前の空欄へ移る
      const ins = [...fill.querySelectorAll('input')];
      ins.forEach((el, n) => {
        el.onkeydown = e => {
          if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); }
          else if (e.key === 'Backspace' && !el.value && n > 0) { e.preventDefault(); ins[n - 1].focus(); }
        };
        el.oninput = e => {
          if (e.isComposing || !/\s/.test(el.value)) return;
          el.value = el.value.replace(/\s+/g, '');
          if (ins[n + 1]) ins[n + 1].focus();
        };
      });
      const first = fill.querySelector('input'); first && first.focus();
    };
    const submit = () => {
      tries++;
      if (tries === 1 && !cloze) {
        const sameLen = firstTry();
        if (ok.every(Boolean)) {
          if (sameLen) return excellent();
          tries = 0; $('msg').textContent = '余分な語が入っています'; return;
        }
        const raw = $('typed').value.split(/\s+/).filter(w => norm(w));
        const near = close < 3 && nearMiss(toks.filter(x => x.n).map(x => x.n), raw.map(norm));
        if (near) { // 1回目の入力としてやり直せる（直せば1回で正解と同じに扱う）
          close++; tries = 0;
          const words = ks => ks.map(k => `「${esc(raw[k])}」`).join('');
          $('msg').innerHTML = `<b class="close">${near.subj.length ? '惜しい！！' : 'スペルが少し違うよ！'}</b>` +
            (near.subj.length ? `主語が違います。${words(near.subj)}を直してください。` : '') +
            (near.typo.length ? `${words(near.typo)}のつづりが1文字違います。` : '') + '直して、もう一度 Submit してください。';
          $('typed').focus();
          return;
        }
      } else {
        const ins = [...$('fill').querySelectorAll('input')];
        ins.forEach(el => {
          const k = +el.dataset.k;
          if (norm(el.value) === toks[k].n) ok[k] = true;
          else if (norm(el.value) && !wrong.has(k)) wrong.set(k, el.value.trim());
        });
        if (ok.every(Boolean)) return excellent();
        // まだの空欄が全部1文字のつづり違いなら、回数に数えずに直させる
        const left = ins.filter(el => !ok[el.dataset.k]);
        if (close < 3 && left.every(el => typo1(toks[el.dataset.k].n, norm(el.value)))) {
          close++; tries--;
          ins.forEach(el => { el.classList.toggle('typo', left.includes(el)); el.classList.remove('miss'); });
          $('msg').innerHTML = `<b class="close">スペルが少し違うよ！</b>黄色い下線の所のつづりが1文字違います。直して、もう一度 Submit してください。`;
          left[0].focus();
          return;
        }
      }
      $('msg').textContent = cloze ? '赤い下線の所を直してください' : '下線の所を入力してください';
      showFill();
    };
    // 間違えた語を「入力（赤の二重線）→ 正解（緑）」で並べる
    const fixes = () => {
      const rows = [...wrong.entries()].sort((a, b) => a[0] - b[0]).map(([k, bad]) =>
        `<span>${bad ? `<del>${esc(bad)}</del>` : '<span class="miss">（抜け）</span>'} → <ins>${esc(toks[k].core || toks[k].t)}</ins></span>`)
        .concat(extra.map(x => `<span><del>${esc(x.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, ''))}</del> <span class="miss">（不要）</span></span>`));
      return rows.length ? `<div class="fixes en"><div class="fixhead">間違えた所</div>${rows.join('')}</div>` : '';
    };
    const excellent = () => {
      $('msg').textContent = '';
      if (tries === 1 && !peeked) delete prog.weak[c.key]; else prog.weak[c.key] = true;
      mark(c);
      revealed = true;
      combo = tries === 1 && !peeked ? combo + 1 : 0;
      const lv = Math.min(combo, 10);
      chime(lv);
      tap.innerHTML = `<div class="excellent ${lv ? `lv${lv}` : 'miss'}">${LEVELS[lv]}
        <small>${close && lv ? '直して正解 · ' : ''}${lv ? `${combo}問連続で正解 · Lv.${lv}` : peeked ? '答えを見て正解 · 連続は 0 から' : `${tries}回目で正解 · 連続は 0 から`}</small>
        ${lv ? `<div class="lvbar">${[...Array(10)].map((_, k) => `<i class="${k < lv ? 'on' : ''}"></i>`).join('')}</div>` : ''}</div>
        ${fixes()}<div class="nexthint">タップ（または Enter）で次へ ›</div>`;
      celebrate(lv, tap.querySelector('.excellent'));
      if (c.w && settings.autoSpeak) { stopSpeak(); speak(spoken(c.w.w)); }
      $('ans').classList.remove('hidden');
      // 答えを見ていられるよう、自動では進まない。カードをタップするか Enter で次へ
      // （Submit を押したクリックや Enter がそのまま届かないよう、次の番で受け付ける）
      setTimeout(() => {
        const card = $('card');
        if (!card || cards[i] !== c) return;
        const next = () => { document.removeEventListener('keydown', onKey); if (cards[i] === c && document.body.contains(card)) go(1); };
        const onKey = e => {
          if (!document.body.contains(card)) { document.removeEventListener('keydown', onKey); return; }
          if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); next(); }
        };
        card.onclick = next; card.classList.add('done');
        document.addEventListener('keydown', onKey);
      }, 0);
    };
    $('submit').onclick = submit;
    // 答えを見る／隠すを切り替える。隠すと入力に戻る
    $('giveup').onclick = () => {
      revealed = !revealed;
      if (revealed) peeked = true;
      stopSpeak();
      $('ans').classList.toggle('hidden', !revealed);
      [$('inputs'), $('submit')].forEach(el => { if (el) el.hidden = revealed; });
      $('giveup').textContent = revealed ? '答えを隠す' : '答えを見る';
      if (revealed) { if (settings.autoSpeak) c.w ? speak(spoken(c.w.w)) : sayEn(c.it); }
      else ($('fill').hidden ? $('typed') : $('fill').querySelector('input')).focus();
    };
    $('typed').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); } };
    if (cloze) showFill(); else $('typed').focus();
  }
  function mark(c) { prog.seen[c.key] = true; saveProg(); }
  function go(d) {
    stopSpeak();
    const n = i + d;
    if (n >= cards.length) {
      if (keepPos) { prog.pos[posKey] = 0; saveProg(); }
      daily ? daily.onDone() : finish(); return;
    }
    i = Math.max(0, n);
    if (keepPos) { prog.pos[posKey] = i; saveProg(); }
    if (daily) daily.onPos(i);
    render(); window.scrollTo(0, 0);
  }
  function finish() {
    const weak = cards.filter(c => prog.weak[c.key]).length;
    const secs = sections();
    const nextSec = typeof sec === 'number' ? secs[secs.indexOf(sec) + 1] : null;
    app.innerHTML = `<div class="empty">
      <div style="font-size:20px;font-weight:700;color:var(--text)">おつかれさまでした</div>
      ${cards.length}問のうち 苦手 ${weak}問<br><br>
      <div class="list">
        ${weak ? `<button class="row" id="again" style="justify-content:center">苦手だけもう一度</button>` : ''}
        ${nextSec ? `<button class="primary" id="nextSec">Section ${nextSec} へ</button>` : ''}
        <button id="home">一覧に戻る</button>
      </div></div>`;
    const again = document.getElementById('again');
    if (again) again.onclick = () => {
      const left = cards.filter(c => prog.weak[c.key]);
      cards.length = 0; cards.push(...left); i = 0; render();
    };
    const ns = document.getElementById('nextSec');
    if (ns) ns.onclick = () => startStudy(nextSec, m);
    document.getElementById('home').onclick = showFree;
  }
  render();
}

// 意味に品詞が2つ以上あるとき（lean: 〔形〕やせた 〔動〕傾く）は品詞ごとに改行する
const posLines = m => esc(m).replace(/\s+(?=〔)/g, '<br>');
function wordList(it) {
  if (!it.words.length) return '';
  return `<div class="words">${it.words.map(w => `<b class="en">${esc(w.w)}</b> ${esc(w.m)}`).join('<br>')}</div>`;
}

// ---------- 通し聞き ----------
let listenRun = null;
function showListen(sec) {
  const its = sec === 'all' ? items.slice() : items.filter(i => i.section === sec);
  if (settings.shuffle) shuffle(its);
  setHeader(`${secName(sec)} · 通し聞き`, showFree, 'free');
  app.innerHTML = `
    <div class="card"><div class="meta"><span id="lpos">${its.length}文</span></div>
      <div class="prompt" id="lja">再生ボタンを押すと、${settings.listenJa ? '和訳→' : ''}英文の順に読み上げます。</div>
      <div class="answer en" id="len"></div></div>
    <div class="tools" id="lrep" style="margin:14px 0 0">${[1, 2, 3].map(n =>
      `<button data-n="${n}" class="${n === settings.listenRepeat ? 'on' : ''}">${n}x</button>`).join('')}</div>
    <div class="nav"><button class="playbtn" id="play"></button></div>
    <p class="note">ボタンを押すたびに再生と停止が切り替わります。1x〜3x は英文を読む回数です。2回目は1.25倍、3回目は1.5倍の速さで、間に3秒あけます。日本語の読み上げは設定で切り替えられます。</p>`;
  const btn = document.getElementById('play');
  const setPlaying = on => { btn.classList.toggle('on', on); btn.textContent = on ? '▶ 再生中' : '■ 停止中'; };
  setPlaying(false);
  document.querySelectorAll('#lrep button').forEach(b => b.onclick = () => {
    settings.listenRepeat = +b.dataset.n; saveSettings();
    document.querySelectorAll('#lrep button').forEach(x => x.classList.toggle('on', x === b));
  });
  btn.onclick = () => {
    if (listenRun) { stopSpeak(); setPlaying(false); return; }
    stopSpeak();
    const run = listenRun = {};
    setPlaying(true);
    let k = 0;
    // iPhone は最初の MP3 再生をボタン操作の中で行わないと、あとの再生を止める。和訳を読み上げ機能で読むときは無音で一度鳴らしておく
    const first = audioUrls.get(parseInt(its[0].no, 10));
    if (first && settings.listenJa && !audioUrls.get(`ja:${parseInt(its[0].no, 10)}`)) {
      player.src = first; player.muted = true;
      player.play().then(() => player.pause()).catch(() => {}).finally(() => { player.muted = false; });
    }
    const step = () => {
      if (listenRun !== run || k >= its.length) { if (listenRun === run) { listenRun = null; setPlaying(false); } return; }
      const it = its[k];
      document.getElementById('lpos').textContent = `No.${it.no} · ${k + 1} / ${its.length}`;
      document.getElementById('lja').textContent = it.ja;
      document.getElementById('len').innerHTML = marked(it.en);
      let done = 0; // 回数は再生中に変えても次の読みから効く
      const en = () => listenRun === run && sayEn(it, () => {
        if (++done < settings.listenRepeat) setTimeout(en, 3000); else { k++; setTimeout(step, 900); }
      }, [1, 1.25, 1.5][done]);
      settings.listenJa ? sayJa(it, () => setTimeout(en, 300)) : en();
    };
    step();
  };
}

  $('file').onclick = () => $('fileIn').click();
  $('fileIn').onchange = async e => { const f = e.target.files[0]; if (f) $('csv').value = await f.text(); };
  $('imp').onclick = () => importText($('csv').value);
  $('audioBtn').onclick = () => $('audioIn').click();
  $('audioIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importAudio(f); };
  $('exp').onclick = exportBackup;
  $('log').onclick = showChangelog;
  $('resetD').onclick = () => {
    if (!confirm('デイリータスクの進み具合と、スケジュール表の学習時間・完了の記録をすべて消して、サイクル 1 の最初から始め直します。よろしいですか？')) return;
    unsaved = 0; sched = newSched(); saveSched(); toast('デイリータスクを初期化しました'); showSettings();
  };
  $('resetP').onclick = () => {
    if (!confirm('苦手の印と進み具合をすべて消します。よろしいですか？')) return;
    prog = { weak: {}, seen: {}, pos: {} }; saveProg(); toast('リセットしました');
  };
}

function showChangelog() {
  setHeader('Change log', showSettings, 'settings');
  app.innerHTML = `<div class="panel">${CHANGELOG.map(c => `<h2>ver${c.v} <span class="note">${c.d}</span></h2>
    <ul class="note">${c.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}</div>`;
  window.scrollTo(0, 0);
}

function importText(text) {
  text = text.trim();
  if (!text) { toast('データが空です'); return; }
  if (text.startsWith('{')) { // バックアップの復元
    try {
      const b = JSON.parse(text);
      if (!Array.isArray(b.items)) throw 0;
      items = b.items; prog = b.progress || prog;
      if (b.schedule) sched = Object.assign(newSched(), b.schedule);
      store.set('duo.items', items); saveProg(); saveSched();
      toast(`${items.length} 文を復元しました`); showHome();
    } catch (e) { toast('バックアップの形式が正しくありません'); }
    return;
  }
  const next = toItems(parseTable(text));
  if (!next.length) { toast('読み取れる行がありませんでした'); return; }
  if (items.length && !confirm(`今のデータ ${items.length} 文を ${next.length} 文に置き換えます。進み具合は同じ番号の文に引き継がれます。`)) return;
  items = next; store.set('duo.items', items);
  toast(`${items.length} 文を取り込みました`); showHome();
}

async function exportBackup() {
  const name = `duo-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([JSON.stringify({ items, progress: prog, schedule: sched })], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) {}
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
loadAudio().catch(() => {});
showHome();
</script>
</body>
</html>
